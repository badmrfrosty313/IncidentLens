server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allows the largest decoded input (20 MiB) after JSON escaping; the API enforces exact limits.
  client_max_body_size 45m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
