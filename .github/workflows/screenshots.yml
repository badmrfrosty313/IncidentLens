name: Capture screenshots

# One-shot helper (delete after use): runs the browser suite against the static demonstration build with
# screenshot capture on, then commits docs/screenshots/*.png. The authoring environment cannot download
# workflow artifacts (rev 2: viewport-sized mobile shots), so the screenshots are committed from CI instead. Triggered by editing this file.
on:
  push:
    branches: [sprint-1-mvp]
    paths: [.github/workflows/screenshots.yml]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run demo:data
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CAPTURE_SCREENSHOTS: "1"
      - name: Commit screenshots
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git diff --cached --quiet && { echo "no screenshot changes"; exit 0; }
          git commit -m "docs: add application screenshots captured by the Playwright suite"
          git push
# retrigger (previous run lost a push race)
