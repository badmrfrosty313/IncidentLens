name: Generate frontend lockfile

# One-shot helper: the lockfile must come from a real `npm install`, and the authoring environment
# had no registry access. This runs only when frontend/package.json changes on the sprint branch
# and package-lock.json is missing or out of date, commits the result, and can then be deleted.
on:
  push:
    branches: [sprint-1-mvp]
    paths: [frontend/package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile if changed
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): add package-lock.json generated by npm"
          git push
