name: Generate frontend lockfile

# One-shot helper (delete after use): the lockfile must come from a real `npm install` and the
# authoring environment has no registry access. Runs when frontend/package.json changes on the
# sprint branch and commits the regenerated package-lock.json.
on:
  push:
    branches: [sprint-1-mvp]
    paths: [frontend/package.json]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --no-audit --no-fund
        working-directory: frontend
      - name: Commit lockfile if changed
        run: |
          git diff --quiet -- frontend/package-lock.json && { echo "Lockfile up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): update package-lock.json generated by npm"
          git push
