name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: python -m pytest
      - name: Demo scenarios match their documented expected outcomes
        run: python scripts/evaluate_demos.py
      - name: Committed demo data and docs are in sync with the generators
        run: |
          python scripts/export_demo_data.py
          git diff --exit-code -- ../data ../docs/DEMO_SCENARIOS.md
      - name: Benchmark smoke test (1k and 10k events)
        run: python scripts/benchmark.py --sizes 1000 10000 --runs 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Real-browser smoke test of the static demonstration build (fixtures come from the Python engine).
    # Pinned: Playwright supports specific Ubuntu releases, and `ubuntu-latest` moved to one it does not support yet.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generate demonstration fixtures with the Python engine
        run: npm run demo:data
      - name: Build the static demonstration site (GitHub Pages base path)
        run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (desktop and mobile)
        run: npm run e2e
        env:
          CAPTURE_SCREENSHOTS: "1"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: warn
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test the running stack (nginx -> UI and API)
        run: |
          docker compose up -d
          scripts/smoke.sh http://localhost:8080
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
